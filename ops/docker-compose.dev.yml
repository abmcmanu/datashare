services:
  postgres:
    image: postgres:16-alpine
    container_name: datashare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: datashare
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - datashare-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare -d datashare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datashare-pg:
    name: datashare-pg
