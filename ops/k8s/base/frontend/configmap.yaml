apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: datashare
data:
  nginx.conf: |
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  1024;
        multi_accept        on;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        server_tokens off;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';
        access_log  /var/log/nginx/access.log main;

        sendfile    on;
        tcp_nopush  on;
        tcp_nodelay on;
        keepalive_timeout 65;

        client_body_temp_path /tmp/nginx_client_body;
        proxy_temp_path       /tmp/nginx_proxy;
        fastcgi_temp_path     /tmp/nginx_fastcgi;
        uwsgi_temp_path       /tmp/nginx_uwsgi;
        scgi_temp_path        /tmp/nginx_scgi;

        gzip              on;
        gzip_vary         on;
        gzip_min_length   1024;
        gzip_comp_level   5;
        gzip_types
            text/plain text/css text/javascript
            application/javascript application/json
            application/xml image/svg+xml font/woff font/woff2;

        limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=5r/m;
        limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=60r/s;
        limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;

        include /etc/nginx/conf.d/*.conf;
    }

  datashare.conf: |
    upstream backend {
        server backend:7777;
        keepalive 16;
    }

    server {
        listen      8080;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options            "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options     "nosniff"                          always;
        add_header X-XSS-Protection           "1; mode=block"                    always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';"
            always;

        location ~ ^/api/(v[0-9]+/)?auth/ {
            limit_req zone=auth_zone burst=2 nodelay;
            limit_req_status 429;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        location ~ ^/api/(v[0-9]+/)?files/upload {
            limit_req zone=upload_zone burst=5 nodelay;
            client_max_body_size  1g;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_request_buffering off;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            client_max_body_size 1g;
            proxy_read_timeout   120s;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires    30d;
            add_header Cache-Control "public";
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
            location = /index.html {
                expires    -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            }
        }

        location ~ /\. {
            deny all;
        }
    }
