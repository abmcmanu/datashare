apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: datashare
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None   # Headless service pour StatefulSet
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
