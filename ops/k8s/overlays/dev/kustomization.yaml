apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: datashare

resources:
  - ../../base

namePrefix: dev-

patches:
  # Réplicas réduits en dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend

  # Ressources allégées en dev
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
    target:
      kind: Deployment
      name: backend

  # Ingress dev — hostname local
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: datashare.local
    target:
      kind: Ingress
      name: datashare

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - DATASHARE_DB_POOL_SIZE=5

secretGenerator:
  - name: postgres-secret
    literals:
      - database=datashare
      - username=datashare
      - password=dev_password_change_me
  - name: backend-secret
    literals:
      - jwt-secret=dev-only-secret-32-chars-minimum-ok
      - cors-origins=http://datashare.local
