upstream backend {
    server backend:7777;
    keepalive 16;
}

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Headers de sécurité ──────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options     "nosniff"                          always;
    add_header X-XSS-Protection           "1; mode=block"                    always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';"
        always;
    # Activer HSTS si TLS est terminé ici (décommenter en prod avec TLS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Auth — rate limiting strict (5 req/min par IP) ───────────────────────
    location ~ ^/api/(v[0-9]+/)?auth/ {
        limit_req zone=auth_zone burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Upload — timeout et taille étendus (1 Go) ────────────────────────────
    location ~ ^/api/(v[0-9]+/)?files/upload {
        limit_req zone=upload_zone burst=5 nodelay;

        client_max_body_size  1g;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── API générale ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;

        client_max_body_size 1g;
        proxy_read_timeout   120s;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Assets Angular — cache long terme (hachés par ng build) ─────────────
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        add_header  X-Content-Type-Options "nosniff" always;
        access_log  off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
    }

    # ── SPA Angular — toutes les routes renvoient index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Pas de cache sur index.html (shell de l'app)
        location = /index.html {
            expires    -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    # ── Bloquer l'accès aux fichiers cachés ──────────────────────────────────
    location ~ /\. {
        deny all;
    }
}