<header class="ds-header">
  <a routerLink="/" class="ds-logo">DataShare</a>

  @if (auth.isAuthenticated()) {
    <div class="ds-user">
      <span class="ds-user-email">{{ auth.currentUser()?.email }}</span>
      <button type="button" class="ds-login" (click)="logout()">Déconnexion</button>
    </div>
  } @else {
    <a routerLink="/login" class="ds-login">Se connecter</a>
  }
</header>

<main class="ds-main">
  <h2 class="ds-question">Tu veux partager un fichier&nbsp;?</h2>

  <button type="button" class="ds-upload" aria-label="Téléverser un fichier">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <path fill="currentColor"
            d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.5 7.5 0 0 0-6.93 4.66A6 6 0 0 0 6 20h13a5 5 0 0 0 .35-9.96Zm-7.35-.04 4 4h-3v4h-2v-4H8l4-4Z"/>
    </svg>
  </button>

  @if (state().kind === 'error') {
    <section class="ds-ping" aria-live="assertive" role="alert">
      <p class="ds-ping-error">
        Service indisponible pour le moment. Veuillez réessayer dans quelques instants.
      </p>
    </section>
  }
</main>

<footer class="ds-footer">
  <small>Copyright DataShare® 2025</small>
</footer>
